<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:"Montserrat";font-weight:700;src:url("fonts/montserrat-latin-700-normal.woff2")}
@font-face{font-family:"Montserrat";font-weight:500;src:url("fonts/montserrat-latin-500-normal.woff2")}
@font-face{font-family:"Playfair Display";font-weight:700;src:url("fonts/playfair-display-latin-700-normal.woff2")}
@font-face{font-family:"Playfair Display";font-weight:600;font-style:italic;src:url("fonts/playfair-display-latin-600-italic.woff2")}
body{margin:0;width:1200px;height:630px;font-family:Montserrat,Arial,sans-serif;background:#1A1A2E;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(800px 420px at 92% -15%,rgba(201,168,76,.2),transparent 62%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px}
.c{position:absolute;inset:0;padding:70px 80px 64px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:20px}
.mark{width:72px;height:72px;background:#24243D;border:1px solid rgba(201,168,76,.4);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Playfair Display";font-weight:700;font-size:26px}
.mark i{display:block;width:32px;height:3px;background:#C9A84C;margin-top:6px}
.brand strong{font-family:"Playfair Display";font-size:36px;font-weight:700;display:block}
.brand small{display:block;font-size:13px;letter-spacing:4px;color:#C9A84C;font-weight:700;margin-top:6px}
.label{display:flex;align-items:center;gap:16px;font-size:15px;letter-spacing:4px;color:#C9A84C;font-weight:700;margin-bottom:22px}
.label:before{content:"";width:44px;height:3px;background:#C9A84C}
h1{font-family:"Playfair Display";font-size:62px;line-height:1.08;margin:0;max-width:1000px;font-weight:700}
h1 em{color:#C9A84C;font-weight:600}
.foot{display:flex;gap:34px;font-size:17px;color:#D9D6CC;font-weight:500;border-top:1px solid rgba(201,168,76,.35);padding-top:22px}
.foot b{color:#C9A84C}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="c">
<div class="brand"><div class="mark">B&amp;F<i></i></div><div><strong>Berto &amp; Fils</strong><small>DEPUIS 2004 · SAINT-JEOIRE-EN-FAUCIGNY</small></div></div>
<div><div class="label">HAUTE-SAVOIE · GENÈVE</div><h1>Nettoyage de <em>salles blanches</em><br>et nettoyage industriel</h1></div>
<div class="foot"><span><b>◆</b> Zones propres &amp; ZAC</span><span><b>◆</b> Bionettoyage ISO 14644</span><span><b>◆</b> 06 67 96 72 26</span></div>
</div></body></html>
