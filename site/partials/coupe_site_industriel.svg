<svg class="coupe coupe-indus" viewBox="0 92 1200 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ci-titre ci-desc">
  <title id="ci-titre">Site industriel en coupe : les surfaces que nous nettoyons</title>
  <desc id="ci-desc">Vue en coupe d'un site industriel : bureaux à l'étage, vestiaires et sanitaires au rez-de-chaussée, atelier de production sous toiture en sheds vitrés, machines, convoyeur, chemins de câbles et luminaires, zone propre de contrôle, bardage métallique et quai de livraison. Une autolaveuse nettoie le sol de l'atelier.</desc>
