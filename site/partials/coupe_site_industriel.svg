    <linearGradient id="ci-propre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F4EA" stop-opacity="0"/><stop offset=".06" stop-color="#F8F4EA"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
